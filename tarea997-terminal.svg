<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Terminal de Linux con comandos de historia">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1734"/>
      <stop offset="50%" stop-color="#101d3a"/>
      <stop offset="100%" stop-color="#090c15"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e2e52" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#1a1b1d"/>
  <rect x="70" y="30" width="1060" height="650" rx="18" fill="url(#bg)"/>
  <rect x="70" y="30" width="1060" height="650" rx="18" fill="url(#screenGlow)"/>

  <g opacity="0.16">
    <rect x="90" y="55" width="1020" height="1" fill="#dfe7ff"/>
    <rect x="90" y="610" width="1020" height="1" fill="#dfe7ff"/>
  </g>

  <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="26" fill="#d7e0ff">
    <text x="135" y="100" fill="#8ce6ff">gabriel@Gabriel</text>
    <text x="420" y="100" fill="#f1f5ff">MINGW64</text>
    <text x="585" y="100" fill="#c9d6f9">/prueba2</text>
    <text x="120" y="150" fill="#66ffcc">$</text>
    <text x="150" y="150" fill="#39ddc1"> history</text>

    <text x="120" y="205" fill="#7ee7ff">1</text>
    <text x="160" y="205" fill="#7fe0a0">curl https://letsdefend.io</text>

    <text x="120" y="245" fill="#7ee7ff">2</text>
    <text x="160" y="245" fill="#7fe0a0">curl https://letsdefend.io</text>

    <text x="120" y="285" fill="#7ee7ff">3</text>
    <text x="160" y="285" fill="#7fe0a0">cd /</text>

    <text x="120" y="325" fill="#7ee7ff">4</text>
    <text x="160" y="325" fill="#7fe0a0">cd</text>

    <text x="120" y="365" fill="#7ee7ff">5</text>
    <text x="160" y="365" fill="#7fe0a0">pwd</text>

    <text x="120" y="405" fill="#7ee7ff">6</text>
    <text x="160" y="405" fill="#7fe0a0">ls</text>

    <text x="120" y="445" fill="#7ee7ff">7</text>
    <text x="160" y="445" fill="#7fe0a0">touch test.txt</text>

    <text x="120" y="485" fill="#7ee7ff">8</text>
    <text x="160" y="485" fill="#7fe0a0">cp test.txt test2.txt</text>

    <text x="120" y="525" fill="#7ee7ff">9</text>
    <text x="160" y="525" fill="#7fe0a0">mv test2.txt test3.txt</text>

    <text x="120" y="565" fill="#7ee7ff">10</text>
    <text x="160" y="565" fill="#7fe0a0">rm -f test2.txt</text>

    <text x="120" y="600" fill="#7ee7ff">11</text>
    <text x="160" y="600" fill="#7fe0a0">cd /</text>
  </g>

  <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="19" fill="#bfd3ff" opacity="0.9">
    <text x="105" y="650">El comando history muestra el registro de instrucciones.</text>
  </g>

  <g transform="translate(0 0)" font-family="Consolas, 'SFMono-Regular', monospace" font-size="16">
    <rect x="958" y="145" width="50" height="18" fill="#b4c4ff" opacity="0.08"/>
    <text x="970" y="159" fill="#83e7ff">~</text>
  </g>
</svg>
